name: Release — Publish

# Triggered three ways:
#   1. Automatically when Release — Build completes (catches fast notarizations)
#   2. On schedule every 2 hours (catches slow notarizations, resilient fallback)
#   3. Manually via workflow_dispatch (for debugging / forced retry)
on:
  workflow_run:
    workflows: ["Release — Build"]
    types: [completed]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest

    steps:
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Find draft releases with pending notarization
      id: find
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # List all draft releases whose body contains a notarization submission ID.
        DRAFTS=$(gh release list --json tagName,isDraft,body \
          --jq '[.[] | select(.isDraft == true) | select(.body | contains("notarization-submission-id:"))]')

        COUNT=$(echo "$DRAFTS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
        echo "Pending draft releases: $COUNT"

        if [ "$COUNT" -eq 0 ]; then
          echo "No pending draft releases — nothing to do."
          echo "FOUND=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "FOUND=true" >> $GITHUB_OUTPUT

        # Write TAG|SUBMISSION_ID lines to a file for the next step.
        echo "$DRAFTS" | python3 - << 'PYEOF'
        import sys, json, re
        drafts = json.load(sys.stdin)
        for d in drafts:
            m = re.search(r'notarization-submission-id:\s*([a-f0-9\-]+)', d['body'])
            if m:
                print(f"{d['tagName']}|{m.group(1)}")
        PYEOF
        ) > /tmp/pending.txt

        cat /tmp/pending.txt

    - name: Process pending releases
      if: steps.find.outputs.FOUND == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: |
        # When triggered by workflow_run (right after build), poll up to 20 min
        # to catch normal fast notarizations (~5–15 min).
        # When triggered by schedule or manual dispatch, check once — if not
        # ready yet the next schedule run will pick it up.
        if [ "${{ github.event_name }}" = "workflow_run" ]; then
          MAX_POLL=40   # 40 × 30 s = 20 min
        else
          MAX_POLL=1
        fi

        while IFS='|' read -r TAG SUBMISSION_ID; do
          [ -z "$TAG" ] && continue
          echo ""
          echo "━━━ $TAG  (submission: $SUBMISSION_ID) ━━━"

          # ── Poll notarization status ───────────────────────────────────────
          ATTEMPT=0
          STATUS=""
          while [ $ATTEMPT -lt $MAX_POLL ]; do
            [ $ATTEMPT -gt 0 ] && sleep 30
            ATTEMPT=$((ATTEMPT + 1))
            INFO=$(xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json 2>&1) || true
            STATUS=$(echo "$INFO" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            echo "  [${ATTEMPT}/${MAX_POLL}] status: ${STATUS:-network error, retrying...}"
            [ "$STATUS" = "Accepted" ] && break
            if [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              echo "❌ Notarization failed for $TAG: $STATUS"
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1 || true
              # Exit with error so the job is marked red in the Actions UI.
              exit 1
            fi
          done

          if [ "$STATUS" != "Accepted" ]; then
            echo "⏳ $TAG not ready (status: ${STATUS:-unknown}) — will retry on next schedule run."
            continue
          fi

          echo "✅ Notarization accepted — stapling and publishing $TAG"

          # ── Download pre-notarization DMG from draft release ──────────────
          mkdir -p /tmp/dmg-work
          gh release download "$TAG" --pattern "*.dmg" --dir /tmp/dmg-work
          DMG_PATH=$(ls /tmp/dmg-work/*.dmg | head -1)
          echo "Downloaded: $DMG_PATH"

          # ── Staple notarization ticket ─────────────────────────────────────
          xcrun stapler staple "$DMG_PATH"
          echo "✅ Stapled"

          # ── Sign for Sparkle ───────────────────────────────────────────────
          swift package resolve
          SIGN_UPDATE=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          SIG_OUTPUT=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$DMG_PATH")
          ED_SIG=$(echo "$SIG_OUTPUT" | grep -o 'edSignature="[^"]*"' | cut -d'"' -f2)
          DMG_LENGTH=$(stat -f%z "$DMG_PATH")
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "Sparkle edSignature: $ED_SIG"

          # ── Re-upload stapled DMG (overwrites pre-notarization asset) ──────
          gh release upload "$TAG" "$DMG_PATH" --clobber
          echo "✅ Stapled DMG re-uploaded"

          # ── Strip hidden metadata comment from release notes, publish ──────
          CLEAN_BODY=$(gh release view "$TAG" --json body --jq '.body' \
            | grep -v 'notarization-submission-id')

          gh release edit "$TAG" --draft=false --notes "$CLEAN_BODY"
          echo "✅ Draft published → $TAG"

          # ── Update appcast.xml + latest.json on main ───────────────────────
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          BUNDLE_VERSION=$((MAJOR * 100 + MINOR * 10 + PATCH))
          REPO="${{ github.repository }}"
          DMG_URL="https://github.com/${REPO}/releases/download/${TAG}/CorrectMe-${TAG}-macos.dmg"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          python3 scripts/update-appcast.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --bundle-version "$BUNDLE_VERSION" \
            --dmg-url "$DMG_URL" \
            --length "$DMG_LENGTH" \
            --signature "$ED_SIG" \
            --pub-date "$(date -u '+%a, %d %b %Y %H:%M:%S +0000')" \
            --appcast "dist/appcast.xml"

          printf '{\n  "tag": "%s",\n  "version": "%s",\n  "asset": "CorrectMe-%s-macos.dmg",\n  "url": "%s",\n  "sha256": "%s",\n  "published_at": "%s"\n}\n' \
            "$TAG" "$VERSION" "$TAG" "$DMG_URL" "$SHA256" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/latest.json

          git add -f dist/appcast.xml dist/latest.json
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          git diff --staged --quiet || \
            git commit -m "release: update appcast.xml and latest.json for $TAG" && \
            git push origin main

          echo "🎉 Release $TAG complete!"

          # Reset work dir for any subsequent releases in the same run
          rm -rf /tmp/dmg-work
        done < /tmp/pending.txt
