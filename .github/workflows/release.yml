name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Swift version
      run: swift --version

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build release app bundle
      run: |
        echo "Building CorrectMe v${{ steps.get_version.outputs.VERSION }}..."

        # Update version in Info.plist
        sed -i '' "s/0.2.1/${{ steps.get_version.outputs.VERSION }}/g" Resources/Info.plist

        # Build .app bundle
        chmod +x scripts/build-app.sh
        ./scripts/build-app.sh release

        # Verify app bundle exists
        if [ ! -d ".build/CorrectMe.app" ]; then
          echo "Build failed - app bundle not found"
          exit 1
        fi

        echo "Build successful!"
        ls -lh .build/CorrectMe.app/Contents/MacOS/correctme

    - name: Run tests
      run: |
        # Run tests if they exist
        if swift test --list-tests 2>/dev/null | grep -q "Test"; then
          echo "Running tests..."
          swift test
        else
          echo "No tests found, skipping..."
        fi
      continue-on-error: true

    - name: Prepare release assets
      run: |
        # Create release directory
        mkdir -p release

        # Copy .app bundle
        cp -R .build/CorrectMe.app release/

        # Create symlink for CLI access (will be in the zip)
        mkdir -p release/cli
        ln -s ../CorrectMe.app/Contents/MacOS/correctme release/cli/correctme

        # Create zip archive with both .app and CLI symlink
        cd release
        zip -r CorrectMe-${{ steps.get_version.outputs.TAG }}-macos.zip CorrectMe.app cli

        # Calculate SHA256
        shasum -a 256 CorrectMe-${{ steps.get_version.outputs.TAG }}-macos.zip | awk '{print $1}' > sha256.txt
        SHA256=$(cat sha256.txt)
        echo "SHA256=$SHA256" >> $GITHUB_ENV

        echo "SHA256: $SHA256"
        ls -lh

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.TAG }}
        release_name: CorrectMe ${{ steps.get_version.outputs.TAG }}
        body: |
          ## CorrectMe ${{ steps.get_version.outputs.TAG }}

          ### Installation

          **Option 1: One-command install (Recommended)**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
          ```

          **Option 2: Download and install manually**
          ```bash
          # Download and extract
          unzip CorrectMe-${{ steps.get_version.outputs.TAG }}-macos.zip

          # Install .app to Applications
          mv CorrectMe.app /Applications/

          # Create CLI symlink
          sudo ln -sf /Applications/CorrectMe.app/Contents/MacOS/correctme /usr/local/bin/correctme

          # Run setup
          correctme setup
          correctme start
          ```

          ### What's Changed

          See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ### Package Contents

          - `CorrectMe.app` - macOS application bundle (install to /Applications)
          - `cli/correctme` - Symlink for CLI access

          ### SHA256 Checksum

          ```
          ${{ env.SHA256 }}  CorrectMe-${{ steps.get_version.outputs.TAG }}-macos.zip
          ```
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release/CorrectMe-${{ steps.get_version.outputs.TAG }}-macos.zip
        asset_name: CorrectMe-${{ steps.get_version.outputs.TAG }}-macos.zip
        asset_content_type: application/zip

    - name: Create latest.json
      run: |
        mkdir -p dist
        cat > dist/latest.json <<EOF
        {
          "tag": "${{ steps.get_version.outputs.TAG }}",
          "version": "${{ steps.get_version.outputs.VERSION }}",
          "asset": "CorrectMe-${{ steps.get_version.outputs.TAG }}-macos.zip",
          "sha256": "${{ env.SHA256 }}",
          "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        }
        EOF

        cat dist/latest.json

    - name: Commit latest.json to main
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Checkout main branch
        git fetch origin main
        git checkout main

        # Copy latest.json
        mkdir -p dist
        cat > dist/latest.json <<EOF
        {
          "tag": "${{ steps.get_version.outputs.TAG }}",
          "version": "${{ steps.get_version.outputs.VERSION }}",
          "asset": "CorrectMe-${{ steps.get_version.outputs.TAG }}-macos.zip",
          "sha256": "${{ env.SHA256 }}",
          "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        }
        EOF

        git add -f dist/latest.json

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: Update latest.json for ${{ steps.get_version.outputs.TAG }}"
          git push origin main
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
