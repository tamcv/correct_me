name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        TAG=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=$TAG" >> $GITHUB_OUTPUT

    - name: Inject LICENSE_SECRET
      run: |
        echo 'let LICENSE_SECRET = "${{ secrets.LICENSE_SECRET }}"' > Sources/LicenseSecret.swift

    - name: Run tests
      run: swift test
      continue-on-error: true

    - name: Import signing certificate
      if: ${{ env.CERT_BASE64 != '' }}
      env:
        CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
        CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        CERT_PATH="$RUNNER_TEMP/cert.p12"
        echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
        security import "$CERT_PATH" \
          -k "$KEYCHAIN_PATH" \
          -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/productsign

        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
        echo "✅ Certificate imported"

    - name: Build release DMG
      env:
        DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        chmod +x scripts/build-release.sh
        ./scripts/build-release.sh

    - name: Sign DMG for Sparkle
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        DMG_PATH=".build/release-dmg/CorrectMe-v${VERSION}-macos.dmg"
        SIGN_UPDATE=".build/artifacts/sparkle/Sparkle/bin/sign_update"

        # Download sign_update if not cached (CI has no .build/artifacts)
        if [ ! -f "$SIGN_UPDATE" ]; then
          SPARKLE_VERSION=$(swift package show-dependencies --format json 2>/dev/null | \
            python3 -c "import sys,json; pkgs=json.load(sys.stdin)['dependencies']; print(next(p['version'] for p in pkgs if 'sparkle' in p['url'].lower()))" 2>/dev/null || echo "2.6.4")
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          SIGN_UPDATE="/tmp/sparkle/bin/sign_update"
        fi

        # Sign and capture output: "edSignature=... length=..."
        SIG_OUTPUT=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" "$DMG_PATH" --account correctme 2>/dev/null \
          || "$SIGN_UPDATE" "$DMG_PATH" -s "$SPARKLE_PRIVATE_KEY")
        echo "sig_output=$SIG_OUTPUT"

        ED_SIG=$(echo "$SIG_OUTPUT" | grep -o 'edSignature="[^"]*"' | cut -d'"' -f2)
        DMG_LENGTH=$(stat -f%z "$DMG_PATH")

        echo "ED_SIG=$ED_SIG" >> $GITHUB_ENV
        echo "DMG_LENGTH=$DMG_LENGTH" >> $GITHUB_ENV

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        TAG="${{ steps.version.outputs.TAG }}"
        DMG_PATH=".build/release-dmg/CorrectMe-v${VERSION}-macos.dmg"
        SHA256=$(cat .build/release-dmg/sha256.txt)
        REPO="${{ github.repository }}"

        cat > /tmp/release-notes.md << EOF
        ## CorrectMe ${TAG}

        ### Install

        \`\`\`bash
        curl -fsSL https://raw.githubusercontent.com/${REPO}/main/scripts/install.sh | sh
        \`\`\`

        Or download the DMG below and drag **CorrectMe.app** into Applications.

        ### SHA256
        \`\`\`
        ${SHA256}  CorrectMe-${TAG}-macos.dmg
        \`\`\`
        EOF

        gh release create "$TAG" "$DMG_PATH" \
          --title "CorrectMe $TAG" \
          --notes-file /tmp/release-notes.md

    - name: Update appcast.xml and latest.json
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        TAG="${{ steps.version.outputs.TAG }}"
        SHA256=$(cat .build/release-dmg/sha256.txt)
        ED_SIG="${{ env.ED_SIG }}"
        DMG_LENGTH="${{ env.DMG_LENGTH }}"
        REPO="${{ github.repository }}"

        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)
        PATCH=$(echo "$VERSION" | cut -d. -f3)
        BUNDLE_VERSION=$((MAJOR * 100 + MINOR * 10 + PATCH))

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin main
        git checkout main

        python3 scripts/update-appcast.py \
          --version "$VERSION" \
          --tag "$TAG" \
          --bundle-version "$BUNDLE_VERSION" \
          --dmg-url "https://github.com/${REPO}/releases/download/${TAG}/CorrectMe-${TAG}-macos.dmg" \
          --length "$DMG_LENGTH" \
          --signature "$ED_SIG" \
          --pub-date "$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"

        printf '{\n  "tag": "%s",\n  "version": "%s",\n  "asset": "CorrectMe-%s-macos.dmg",\n  "sha256": "%s",\n  "published_at": "%s"\n}\n' \
          "$TAG" "$VERSION" "$TAG" "$SHA256" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/latest.json

        git add dist/appcast.xml dist/latest.json
        git diff --staged --quiet || (git commit -m "release: update appcast.xml and latest.json for $TAG" && git push origin main)

    - name: Cleanup keychain
      if: always()
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
        [ -f "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
