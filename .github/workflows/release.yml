name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        TAG=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=$TAG" >> $GITHUB_OUTPUT

    - name: Inject LICENSE_SECRET
      run: |
        echo 'let LICENSE_SECRET = "${{ secrets.LICENSE_SECRET }}"' > Sources/LicenseSecret.swift

    - name: Run tests
      run: swift test
      continue-on-error: true

    - name: Import signing certificate
      if: ${{ env.CERT_BASE64 != '' }}
      env:
        CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
        CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        CERT_PATH="$RUNNER_TEMP/cert.p12"
        echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
        security import "$CERT_PATH" \
          -k "$KEYCHAIN_PATH" \
          -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/productsign

        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
        echo "✅ Certificate imported"

    - name: Build release DMG
      env:
        DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        chmod +x scripts/build-release.sh
        ./scripts/build-release.sh

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        TAG="${{ steps.version.outputs.TAG }}"
        DMG_PATH=".build/release-dmg/CorrectMe-v${VERSION}-macos.dmg"
        SHA256=$(cat .build/release-dmg/sha256.txt)
        REPO="${{ github.repository }}"

        cat > /tmp/release-notes.md << EOF
        ## CorrectMe ${TAG}

        ### Install

        \`\`\`bash
        curl -fsSL https://raw.githubusercontent.com/${REPO}/main/scripts/install.sh | sh
        \`\`\`

        Or download the DMG below and drag **CorrectMe.app** into Applications.

        ### SHA256
        \`\`\`
        ${SHA256}  CorrectMe-${TAG}-macos.dmg
        \`\`\`
        EOF

        gh release create "$TAG" "$DMG_PATH" \
          --title "CorrectMe $TAG" \
          --notes-file /tmp/release-notes.md

    - name: Update dist/latest.json
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        TAG="${{ steps.version.outputs.TAG }}"
        SHA256=$(cat .build/release-dmg/sha256.txt)

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin main
        git checkout main

        mkdir -p dist
        cat > dist/latest.json << EOF
        {
          "tag": "$TAG",
          "version": "$VERSION",
          "asset": "CorrectMe-${TAG}-macos.dmg",
          "sha256": "$SHA256",
          "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        }
        EOF

        git add dist/latest.json
        git diff --staged --quiet || git commit -m "chore: update latest.json for $TAG" && git push origin main

    - name: Cleanup keychain
      if: always()
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
        [ -f "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
